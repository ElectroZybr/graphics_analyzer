[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphics-analyzer"
version = "0.1.0"
description = "Interactive plotting toolkit based on pyqtgraph"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyqtgraph>=0.13",
  "PyQt6>=6.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graphics_analyzer*"]
